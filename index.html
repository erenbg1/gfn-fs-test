<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GFN FS API Lab v2</title>
<style>
body { font-family: sans-serif; padding: 20px; }
button { display:block; margin:10px 0; padding:10px; }
#drop {
  border:2px dashed #777;
  padding:30px;
  margin-top:20px;
}
pre { white-space:pre-wrap; }
</style>
</head>
<body>

<h2>GFN File System API Lab v2</h2>

<div id="caps"></div>

<button id="dir">1 — showDirectoryPicker</button>
<button id="open">2 — showOpenFilePicker</button>
<button id="save">3 — showSaveFilePicker</button>
<button id="pathsave">6 — Save Picker Relative Path Test</button>
<button id="dlforward">7 — Download Path Test (forward slash)</button>
<button id="dlback">8 — Download Path Test (backslash)</button>



<p>4 — webkitdirectory:</p>
<input id="webkit" type="file" webkitdirectory multiple>


<button id="batch3">9 — TEST: Download 3 Files</button>
<div id="drop">
5 — DRAG A FILE OR FOLDER HERE
</div>

<pre id="log"></pre>

<script>
const log = document.getElementById("log");
const caps = document.getElementById("caps");

function out(x) {
  log.textContent += x + "\n";
}

caps.innerHTML =
  "showDirectoryPicker: " + typeof window.showDirectoryPicker + "<br>" +
  "showOpenFilePicker: " + typeof window.showOpenFilePicker + "<br>" +
  "showSaveFilePicker: " + typeof window.showSaveFilePicker + "<br>" +
  "getAsFileSystemHandle: " +
  typeof DataTransferItem.prototype.getAsFileSystemHandle;

document.getElementById("dir").onclick = async () => {
  try {
    out("DIR: opening...");
    const h = await showDirectoryPicker({mode:"readwrite"});
    out("DIR SUCCESS: " + h.name);
  } catch(e) {
    out("DIR ERROR: " + e.name + " — " + e.message);
  }
};

document.getElementById("open").onclick = async () => {
  try {
    out("OPEN: opening...");
    const h = await showOpenFilePicker({multiple:true});
    out("OPEN SUCCESS:");
    for (const x of h) out(x.kind + " — " + x.name);
  } catch(e) {
    out("OPEN ERROR: " + e.name + " — " + e.message);
  }
};

document.getElementById("save").onclick = async () => {
  try {
    out("SAVE: opening...");
    const h = await showSaveFilePicker({
      suggestedName:"GFN_SAVE_TEST.txt"
    });

    out("SAVE HANDLE: " + h.name);

    const w = await h.createWritable();
    await w.write("GFN Steam Overlay write test");
    await w.close();

    out("SAVE WRITE SUCCESS");
  } catch(e) {
    out("SAVE ERROR: " + e.name + " — " + e.message);
  }
};


document.getElementById("pathsave").onclick = async () => {
  try {
    out("PATHSAVE: opening...");

    const h = await showSaveFilePicker({
      suggestedName: "GFNProbe\\\\NestedTest.txt"
    });

    out("PATHSAVE HANDLE: " + h.name);

    const w = await h.createWritable();
    await w.write("relative path test");
    await w.close();

    out("PATHSAVE WRITE SUCCESS");
  } catch(e) {
    out("PATHSAVE ERROR: " + e.name + " — " + e.message);
  }
};



document.getElementById("batch3").onclick = async () => {
  out("BATCH3 START");

  const files = [
    ["GFN_BATCH_1.txt", "file one"],
    ["GFN_BATCH_2.txt", "file two"],
    ["GFN_BATCH_3.txt", "file three"]
  ];

  for (const [name, text] of files) {
    const blob = new Blob([text], {type:"text/plain"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();

    out("TRIGGERED: " + name);

    await new Promise(r => setTimeout(r, 1200));
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  out("BATCH3 DONE");
};

function blobDownload(filename, text) {
  const blob = new Blob([text], {type: "text/plain"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

document.getElementById("dlforward").onclick = () => {
  out("DOWNLOAD / test...");
  blobDownload("GFNProbe/SubModule.xml", "forward slash test");
};

document.getElementById("dlback").onclick = () => {
  out("DOWNLOAD \\\\ test...");
  blobDownload("GFNProbe\\\\SubModule.xml", "backslash test");
};

document.getElementById("webkit").onchange = e => {
  out("WEBKITDIRECTORY FILES: " + e.target.files.length);

  for (const f of e.target.files) {
    out(f.webkitRelativePath + " — " + f.size);
  }
};

const drop = document.getElementById("drop");

drop.ondragover = e => {
  e.preventDefault();
  drop.style.background = "#ddd";
};

drop.ondragleave = () => {
  drop.style.background = "";
};

drop.ondrop = async e => {
  e.preventDefault();
  drop.style.background = "";

  out("DROP ITEMS: " + e.dataTransfer.items.length);

  for (const item of e.dataTransfer.items) {
    out("DROP: kind=" + item.kind + " type=" + item.type);

    if (item.getAsFileSystemHandle) {
      try {
        const h = await item.getAsFileSystemHandle();
        out("HANDLE: " + h.kind + " — " + h.name);

        if (h.kind === "directory") {
          try {
            const test = await h.getFileHandle(
              "GFN_DRAG_WRITE_TEST.txt",
              {create:true}
            );

            const w = await test.createWritable();
            await w.write("GFN drag/drop filesystem write test");
            await w.close();

            out("DRAG DIRECTORY WRITE SUCCESS");
          } catch(err) {
            out("DRAG WRITE ERROR: " + err.name + " — " + err.message);
          }
        }
      } catch(err) {
        out("HANDLE ERROR: " + err.name + " — " + err.message);
      }
    }
  }
};
</script>

</body>
</html>
